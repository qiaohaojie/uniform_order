name: check-types

# Shape owned by process 1250 (PR Landing and CI Flow): on demand only,
# cancel stale runs, skip docs-only changes.
# Before adding a path to `paths-ignore`, confirm no code or test reads it.

# On demand only (process 1250 Step 6): the local gate (`next typegen` then
# `pnpm check-types`) is the oracle; CI is a paid confirmation run once per
# PR at landing, never on every push. Triggers: Actions "Run workflow" /
# `gh workflow run check-types --ref <branch>`, a draft PR marked ready for
# review, or adding the `ci` label to a PR (remove + re-add the label to
# re-run after a fix).
on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - "decisions/**"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"
      - ".grok/**"
      - ".remember/**"

# A newer confirmation run for the same PR/branch cancels the older one.
# `labeled` fires for every label, so a label other than `ci` gets a group
# of its own: it must not cancel the run that `ci` started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci' && github.run_id || 'ci' }}
  cancel-in-progress: true

# One gate for the whole pipeline; the jobs live in check-types-jobs.yml. A label
# other than `ci` skips this one job: no billed minutes, and one skipped
# check named `ci`. Do not add jobs here. `gh pr checks` keeps the newest
# check per name, so a skipped job in this file would hide the real check
# of the same name and the landing chain would merge early.
jobs:
  ci:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci')
    uses: ./.github/workflows/check-types-jobs.yml
    secrets: inherit
